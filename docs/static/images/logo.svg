<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="aims">
  <title>aims</title>
  <defs>
    <linearGradient id="aims-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231c52"/>
      <stop offset="1" stop-color="#0f0c24"/>
    </linearGradient>
    <clipPath id="aims-left"><circle cx="25" cy="32" r="12.5"/></clipPath>
    <clipPath id="aims-lower"><rect x="0" y="32" width="64" height="32"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#aims-bg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <!-- two accounts; the overlap they share -->
  <circle cx="39" cy="32" r="12.5" fill="#f1edff" clip-path="url(#aims-left)"/>
  <circle cx="25" cy="32" r="12.5" fill="none" stroke="#9d8cff" stroke-width="5"/>
  <circle cx="39" cy="32" r="12.5" fill="none" stroke="#5fd7e8" stroke-width="5"/>
  <!-- the left ring passes over the right one below the middle: linked, not stacked -->
  <circle cx="25" cy="32" r="12.5" fill="none" stroke="#9d8cff" stroke-width="5" clip-path="url(#aims-lower)"/>
</svg>
