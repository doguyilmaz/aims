name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs ["docs/**", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Build revision checks
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: bash scripts/test-source-revision.sh
      - name: macOS update configuration checks
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: python3 -B scripts/test-macos-updates.py
      - run: go vet ./...
      - name: Race tests
        if: runner.os != 'Linux'
        run: go test -race ./...
      - name: macOS usage app tests
        if: runner.os == 'macOS'
        run: swift test --package-path macos/AimsUsage
      - name: Build macOS usage app
        id: macos-app
        if: runner.os == 'macOS'
        run: |
          scripts/build-macos-app.sh
          codesign --verify --deep --strict 'dist/Aims Usage.app'
          plutil -lint 'dist/Aims Usage.app/Contents/Info.plist'
          app_version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' 'dist/Aims Usage.app/Contents/Info.plist')
          archive="dist/Aims-Usage-${app_version}.zip"
          ditto -c -k --keepParent 'dist/Aims Usage.app' "$archive"
          echo "version=$app_version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload development app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Aims-Usage-${{ steps.macos-app.outputs.version }}-macOS-${{ runner.arch }}-development
          path: ${{ steps.macos-app.outputs.archive }}
          retention-days: 7
      - name: Build isolated macOS usage preview
        if: runner.os == 'macOS'
        run: |
          AIMS_USAGE_PREVIEW=1 \
            AIMS_USAGE_CLI_BINARY="$PWD/dist/Aims Usage.app/Contents/Resources/aims" \
            scripts/build-macos-app.sh
      - name: Race tests with isolated process visibility
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: scripts/test-linux-isolated.sh

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
      - name: Build every platform
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean
      - name: npm packages
        run: node scripts/npm/build.mjs v0.0.0-snapshot
