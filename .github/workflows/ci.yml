name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs ["docs/**", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Race tests
        if: runner.os != 'Linux'
        run: go test -race ./...
      - name: Race tests with isolated process visibility
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          # Host runner daemons can deny /proc inspection even for the same
          # user. Keep the fail-closed reconciliation guard and test it in a
          # dedicated PID namespace, as in the offline local validation.
          # Idle-process assertions also need other test packages/scripts not
          # to spawn or replace processes during the /proc snapshot. Explicit
          # concurrency tests still exercise their own workers and goroutines.
          toolchain_version=$(go env GOVERSION)
          test_image="golang:${toolchain_version#go}-bookworm"
          docker pull "$test_image"
          docker run --rm --pull=never --network none --read-only --user 65534:65534 \
            --memory 3g --memory-swap 3g --cpus 2 --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges \
            --ulimit nofile=1024:1024 --ulimit fsize=1073741824:1073741824 --ulimit cpu=900:900 \
            --tmpfs /scratch:rw,exec,size=2g,mode=1777 \
            --tmpfs /scratch/otherfs:rw,size=32m,mode=1777 --tmpfs /dev/shm:ro,size=16m \
            --mount "type=bind,src=$PWD,dst=/src,readonly" \
            --mount "type=bind,src=$(go env GOMODCACHE),dst=/deps,readonly" \
            --workdir /src --entrypoint /usr/bin/env "$test_image" \
            -i PATH=/usr/local/go/bin:/usr/bin:/bin HOME=/scratch/home TMPDIR=/scratch \
            GOCACHE=/scratch/cache GOMODCACHE=/deps GOPATH=/scratch/gopath \
            GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off GOTELEMETRY=off CGO_ENABLED=1 GOMAXPROCS=2 \
            AIMS_TEST_SECOND_FS=/scratch/otherfs GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0=/src \
            timeout 900 go test -race -count=1 -p 1 -parallel 1 ./...

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
      - name: Build every platform
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean
      - name: npm packages
        run: node scripts/npm/build.mjs v0.0.0-snapshot
