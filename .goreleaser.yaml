# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: aims

before:
  hooks:
    - go mod download
    - ./scripts/completions.sh

builds:
  - id: aims
    main: ./cmd/aims
    binary: aims
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: aims
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - completions/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: doguyilmaz
    name: aims
  footer: |
    Install: `brew install doguyilmaz/tap/aims`, `npm install -g @doguyilmaz/aims`,
    `go install github.com/doguyilmaz/aims/cmd/aims@{{ .Tag }}`, or
    `curl -fsSL https://raw.githubusercontent.com/doguyilmaz/aims/main/scripts/install.sh | sh`.
  draft: true
