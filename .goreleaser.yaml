# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: aims

before:
  hooks:
    - go mod download
    - ./scripts/completions.sh

builds:
  - id: aims
    main: ./cmd/aims
    binary: aims
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: aims
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - completions/*

# Developer ID signature with the hardened runtime, then notarization, so
# Gatekeeper opens the macOS binaries without a prompt. Releases fail without
# the secrets; snapshots skip it.
notarize:
  macos:
    - enabled: "{{ not .IsSnapshot }}"
      ids: [aims]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        # The cask points at the archives right away; Gatekeeper must find the ticket.
        wait: true
        timeout: 20m

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

homebrew_casks:
  - name: aims
    repository:
      owner: doguyilmaz
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://doguyilmaz.github.io/aims/
    description: Several Claude Code and Codex accounts on one machine
    license: MIT
    commit_author:
      name: aims release bot
      email: noreply@github.com
    commit_msg_template: "aims {{ .Tag }}"
    completions:
      bash: completions/aims.bash
      zsh: completions/aims.zsh
      fish: completions/aims.fish

scoops:
  - name: aims
    repository:
      owner: doguyilmaz
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://doguyilmaz.github.io/aims/
    description: Several Claude Code and Codex accounts on one machine
    license: MIT
    commit_author:
      name: aims release bot
      email: noreply@github.com
    commit_msg_template: "aims {{ .Tag }} (scoop)"

release:
  github:
    owner: doguyilmaz
    name: aims
  footer: |
    Install: `brew install doguyilmaz/tap/aims`, `npm install -g @doguyilmaz/aims`,
    `go install github.com/doguyilmaz/aims/cmd/aims@{{ .Tag }}`, or
    `curl -fsSL https://raw.githubusercontent.com/doguyilmaz/aims/main/scripts/install.sh | sh`.
